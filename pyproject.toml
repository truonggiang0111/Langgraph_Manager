[project]
name = "langgraph-manager"
version = "0.1.0"
description = "Local LangGraph manager that replaces n8n /dev AI orchestration."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "langgraph>=1.0.0",
  "langchain-core>=1.0.0",
  "playwright>=1.56.0",
  "pypdf>=6.0.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

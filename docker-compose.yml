services:
  langgraph-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph-manager
    restart: unless-stopped
    environment:
      LANGGRAPH_MANAGER_ENV: local
      LANGGRAPH_STATE_DIR: /data/state
      LANGGRAPH_WORKSPACE_ROOT: /workspace/LangGraph_Manager
      CLAUDE_HOME_PATH: /claude-home
      CLAUDE_EXECUTOR_HOME_PATH: /home/node/.claude
      CODEGRAPH_ENABLED: 1
      LANGGRAPH_PYTHON: python
      LANGGRAPH_UI_URL: http://host.docker.internal:8899/api/health
      LANGGRAPH_PUBLIC_URL: https://langgraph.clawflow.shop
      HOST_BROWSER_BRIDGE_URL: http://10.5.0.2:3342
      CLIPROXY_BASE_URL: http://host.docker.internal:8317
      CLIPROXY_MODEL: gpt-5.4
      CLIPROXY_CHAT_MODEL: gpt-5.4
      CLIPROXY_PLAN_MODEL: gpt-5.5
      CLIPROXY_CHAT_MAX_TOKENS: 700
      CLIPROXY_MANAGEMENT_PASSWORD: codex-test
      CLIPROXY_STREAM_TIMEOUT_SECONDS: 20
      CLAUDE_EXECUTOR_COMMAND: docker run --rm -i --entrypoint /usr/local/bin/claude-executor-entrypoint --user node --group-add 0 --add-host host.docker.internal:host-gateway -e HOME=/home/node -e NPM_CONFIG_CACHE=/home/node/.npm -e SSH_SOURCE_DIR=/ssh-host -e ANTHROPIC_BASE_URL=http://host.docker.internal:8082 -e ANTHROPIC_AUTH_TOKEN=freecc -e ANTHROPIC_API_KEY=freecc -e CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=1 -e GIT_SSH_COMMAND=ssh -v /var/run/docker.sock:/var/run/docker.sock -v D:/User/File:/workspace -v D:/User/File/ClaudeHome:/home/node/.claude -v D:/User/File/ClaudeHome/.claude.json:/home/node/.claude.json -v C:/Users/giang/.ssh:/ssh-host:ro -w /workspace/LangGraph_Manager claude-executor-mcp:local -p --model gpt-5.4 --permission-mode bypassPermissions --tools default --add-dir /workspace --add-dir /workspace/LangGraph_Manager --output-format text
      CLAUDE_EXECUTOR_TIMEOUT: 900
      CUT_VIDEO_BRIDGE_URL: http://host.docker.internal:3337
      N8N_BASE_URL: http://host.docker.internal:5678
      OPENCLAW_HOOK_URL: http://host.docker.internal:18789/hooks/agent
    ports:
      - "8899:8899"
    volumes:
      - ./src:/app/src
      - ./data:/data/state
      - D:/User/File:/workspace
      - D:/User/File/ClaudeHome:/claude-home:ro
      - /var/run/docker.sock:/var/run/docker.sock
